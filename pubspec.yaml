name: organizer
description: "Local organization application for management of finance and file storage, as well as secure data transmission via mutiple devices, to synchronnize changes on the go."
publish_to: 'none'
version: 1.0.1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.40
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  intl: ^0.20.2
  path: ^1.9.1
  json_annotation: ^4.9.0
  fl_chart: ^1.1.1
  collection: ^1.19.1
  flutter_colorpicker: ^1.1.0
  flutter_localizations:
    sdk: flutter
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  encrypt: ^5.0.3
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.10.1

flutter:
  uses-material-design: true
  generate: true
